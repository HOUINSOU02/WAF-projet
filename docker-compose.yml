services:

  bunkerweb:
    image: bunkerity/bunkerweb:1.6.9
    ports:
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:8443:8443"
    environment:
      - SERVER_NAME=localhost
      - API_WHITELIST_IP=127.0.0.0/8 10.89.1.0/24 10.88.0.0/16 172.16.0.0/12
      - USE_MODSECURITY=yes
      - MODSECURITY_MODE=blocking
      - USE_MODSECURITY_CRS=yes
      - USE_REVERSE_PROXY=yes
      - REVERSE_PROXY_URL=/
      # Configuration du Rate Limiting
      - USE_LIMIT_REQ=yes
      - LIMIT_REQ_RATE=5r/s
      - LIMIT_REQ_BURST=10
      # Autoriser la simulation d'IP via X-Forwarded-For pour les tests
      - USE_REAL_IP=yes
      - REAL_IP_HEADER=X-Forwarded-For
      - REAL_IP_FROM=127.0.0.1 10.89.1.0/24 172.16.0.0/12
      # Pointe vers le proxy IA au lieu de bWAPP directement
      - REVERSE_PROXY_HOST=http://waf-ia-proxy:9000
    cap_add:
      - NET_RAW
    volumes:
      - bw_data:/data
    networks:
      waf_net:
        ipv4_address: 10.89.1.10

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.9
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - BUNKERWEB_INSTANCES=http://10.89.1.10:5000
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - bw_data:/data
    networks:
      waf_net:
        ipv4_address: 10.89.1.11
    depends_on:
      - bunkerweb

  bw-ui:
    image: bunkerity/bunkerweb-ui:1.6.9
    ports:
      - "0.0.0.0:7000:7000"
    environment:
      - ADMIN_USERNAME=${BW_ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${BW_ADMIN_PASSWORD}
    volumes:
      - bw_data:/data
    networks:
      waf_net:
        ipv4_address: 10.89.1.12

  bwapp:
    image: raesene/bwapp
    container_name: bwapp
    ports:
      - "0.0.0.0:8888:80"
    environment:
      - MYSQL_ROOT_PASSWORD=bwapp
    networks:
      waf_net:
        ipv4_address: 10.89.1.20
    depends_on:
      - bwapp-db

  bwapp-db:
    image: mysql:5.7
    container_name: bwapp-db
    environment:
      - MYSQL_ROOT_PASSWORD=bwapp
      - MYSQL_DATABASE=bwapp
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      waf_net:
        ipv4_address: 10.89.1.21

  # ── Proxy WAF-IA ──────────────────────────────────────────────────────────
  waf-ia-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: waf-ia-proxy
    ports:
      - "0.0.0.0:9000:9000"
    environment:
      - IA_URL=http://10.89.1.40:8000
      - BWAPP_URL=http://10.89.1.20:80
    networks:
      waf_net:
        ipv4_address: 10.89.1.45
    restart: unless-stopped
    depends_on:
      - ia-module
      - bwapp
  # ─────────────────────────────────────────────────────────────────────────

  loki:
    image: grafana/loki:3.4.2
    ports:
      - "0.0.0.0:3100:3100"
    volumes:
      - ./monitoring/loki-data:/loki-data
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      waf_net:
        ipv4_address: 10.89.1.30

  promtail:
    image: grafana/promtail:3.4.2
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    networks:
      waf_net:
        ipv4_address: 10.89.1.31
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      waf_net:
        ipv4_address: 10.89.1.32
    depends_on:
      - loki

  ia-module:
    build: ./ia
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      waf_net:
        ipv4_address: 10.89.1.40
    restart: unless-stopped

  siem:
    build: ./siem
    ports:
      - "0.0.0.0:5001:5000"
    environment:
      - LOKI_URL=http://10.89.1.30:3100
      - IA_URL=http://10.89.1.40:8000
      - PROXY_URL=http://10.89.1.45:9000
    networks:
      waf_net:
        ipv4_address: 10.89.1.50
    restart: unless-stopped
    depends_on:
      - loki
      - ia-module
      - waf-ia-proxy

volumes:
  bw_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/luky/waf-project/bw_data
  grafana_data:

networks:
  waf_net:
    name: waf_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.1.0/24
          gateway: 10.89.1.1
